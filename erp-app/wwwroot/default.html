<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPP System</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      overflow:hidden;
    }

    .card{
      width:420px;
      padding:40px;
      border-radius:22px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.15);
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,0.4);
      position:relative;
    }

    .glow{
      position:absolute;
      width:180px;
      height:180px;
      background:#7c3aed;
      border-radius:50%;
      filter:blur(80px);
      opacity:0.4;
      top:-60px;
      right:-40px;
      z-index:-1;
    }

    h1{
      color:white;
      font-size:52px;
      letter-spacing:4px;
      margin-bottom:12px;
      text-transform:uppercase;
    }

    .prime{
      color:#a855f7;
      text-shadow:0 0 15px rgba(168,85,247,0.8);
    }

    p{
      color:#cbd5e1;
      font-size:18px;
      line-height:1.6;
      margin-top:10px;
    }

    .btn{
      display:inline-block;
      margin-top:28px;
      padding:14px 32px;
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-weight:bold;
      background:linear-gradient(135deg,#7c3aed,#9333ea);
      transition:0.3s;
      box-shadow:0 10px 25px rgba(124,58,237,0.4);
    }

    .btn:hover{
      transform:translateY(-4px) scale(1.03);
      box-shadow:0 15px 35px rgba(124,58,237,0.6);
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="glow"></div>

    <h1>ERPP <span class="prime">SYSTEM</span></h1>

    <p>
     Designed for Migration
    </p>

    <a href="#" class="btn">Azure Migration Web</a>
  </div>

</body>
</html>
