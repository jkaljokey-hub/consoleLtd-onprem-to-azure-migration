name: Azure Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/azure-deploy.yml"

jobs:
  terraform:
    name: Deploy Azure Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

  deploy_iis:
    name: Deploy ERP App to IIS
    needs: terraform
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PowerShell
        uses: PowerShell/PowerShell@v1

      - name: Copy ERP files to Azure VM via WinRM
        uses: microsoft/PowerShell-DSC@v1
        with:
          dsc_script: |
            $username = "${{ secrets.WIN_USERNAME }}"
            $password = ConvertTo-SecureString "${{ secrets.WIN_PASSWORD }}" -AsPlainText -Force
            $cred = New-Object System.Management.Automation.PSCredential($username, $password)

            $session = New-PSSession -ComputerName "${{ secrets.VM_PUBLIC_IP }}" -Credential $cred -UseSSL -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

            Copy-Item -Path "./erp-app/*" -Destination "C:\inetpub\wwwroot\ERPAPP" -Recurse -Force -ToSession $session

            Invoke-Command -Session $session -ScriptBlock {
              Restart-Service W3SVC
            }

            Remove-PSSession $session

      - name: Deployment Completed
        run: echo "ERP App deployed successfully to IIS"
